# Conda environment for the selector notebook (notebooks/selector.ipynb).
# Two steps (pip is run by hand because conda's own pip step breaks on Windows user names that contain a space):
#   conda env create -f environment.yml
#   conda activate bigdata-selector
#   python -m pip install -r notebooks/requirements.txt
# Then in VS Code: open notebooks/selector.ipynb -> Select Kernel -> Python Environments -> bigdata-selector
name: bigdata-selector
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ipykernel
